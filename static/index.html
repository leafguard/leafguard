<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafGuard - Crop Disease Scanner</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fbfdf9;
      color: #1b2e1b;
    }
    h1 { color: #1e6b2c; margin-bottom: 0.5rem; }
    p { color: #4a5d4e; margin-top: 0; }
    .card {
      background: white;
      border: 1px solid #dbe6dc;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    input[type="file"] {
      display: block;
      margin: 1rem 0;
      padding: 0.5rem;
      border: 1px dashed #7ea383;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #257d36;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      width: 100%;
    }
    button:hover { background: #1c642a; }
    button:disabled { background: #9bb7a0; cursor: not-allowed; }
    pre {
      background: #f3f7f4;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.85rem;
      margin-top: 1rem;
      border: 1px solid #e1ebe2;
    }
    .status { margin-top: 1rem; font-weight: 500; }
  </style>
</head>
<body>
  <h1>🌿 LeafGuard</h1>
  <p>Scan a crop leaf to identify diseases with sourced advice.</p>
  <div class="card">
    <label for="leafInput">Select or photograph a leaf:</label>
    <input type="file" id="leafInput" accept="image/*" capture="environment">
    <button id="scanBtn" type="button">Scan Leaf</button>
    <div id="statusMsg" class="status"></div>
    <pre id="output">Results will appear here...</pre>
  </div>
  <script src="/app.js"></script>
</body>
</html>
